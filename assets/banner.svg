<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="line-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    .pulse-glow-1 {
      animation: pulseAnim1 8s ease-in-out infinite alternate;
    }
    .pulse-glow-2 {
      animation: pulseAnim2 10s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 25s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6 10;
      animation: dashFlowRev 20s linear infinite;
    }
    .node-pulse {
      animation: nodePulse 3s ease-in-out infinite;
    }
    .orbit-dot {
      animation: orbitFloat 6s ease-in-out infinite alternate;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -400;
      }
    }
    @keyframes dashFlowRev {
      to {
        stroke-dashoffset: 400;
      }
    }
    @keyframes pulseAnim1 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.9; }
    }
    @keyframes pulseAnim2 {
      0% { transform: scale(1.1) translate(0, 0); opacity: 0.4; }
      100% { transform: scale(0.95) translate(-25px, 20px); opacity: 0.8; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes orbitFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" fill="url(#bg-grad)" />

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle cx="200" cy="70" r="140" fill="url(#glow-teal)" filter="url(#blur-soft)" class="pulse-glow-1" />
  <circle cx="1020" cy="270" r="160" fill="url(#glow-purple)" filter="url(#blur-soft)" class="pulse-glow-2" />
  <circle cx="600" cy="170" r="280" fill="url(#center-glow)" />

  <!-- Background Data Flow Pipelines (Dynamic Animated Dashes) -->
  <g fill="none" stroke-width="1.5" opacity="0.45">
    <path d="M -50 70 C 250 40, 400 130, 600 70 S 950 20, 1250 80" stroke="url(#line-flow)" class="flow-line" />
    <path d="M -50 260 C 200 290, 450 200, 650 260 S 980 320, 1250 250" stroke="url(#line-flow)" class="flow-line-rev" />
    <path d="M 120 360 C 240 220, 380 300, 500 180 S 780 80, 1100 -20" stroke="url(#line-flow)" class="flow-line" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Geometric Grid Accent Dots (Data Warehouse Nodes) -->
  <g fill="#38bdf8" opacity="0.35" class="orbit-dot">
    <circle cx="140" cy="60" r="2.5" />
    <circle cx="280" cy="90" r="2" />
    <circle cx="920" cy="80" r="3" />
    <circle cx="1060" cy="120" r="2" />
    <circle cx="160" cy="270" r="3" />
    <circle cx="1020" cy="260" r="2.5" />
  </g>

  <g fill="#c084fc" opacity="0.4">
    <circle cx="480" cy="50" r="3" class="node-pulse" style="transform-origin: 480px 50px;" />
    <circle cx="720" cy="290" r="3" class="node-pulse" style="transform-origin: 720px 290px; animation-delay: 1.5s;" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Pristine Readability -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 58)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1.5">DATA ENGINEERING &amp; MODELING</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="132" text-anchor="middle" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.8">
    Awesome Data Transformation
  </text>
  <text x="600" y="178" text-anchor="middle" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    &amp; Modeling Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Curated Hub of SQL-First Modeling, Visual Canvas ELT, Schema Evolution &amp; In-Warehouse Pipelines
  </text>

  <!-- Bottom Pills / Tags (Foreground) -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: SQL-First -->
    <g transform="translate(-250, 0)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#111827" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4.5" fill="#e2e8f0" font-size="11.5" font-weight="500">⚡ SQL-First</text>
    </g>

    <!-- Pill 2: Open-Source -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#111827" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4.5" fill="#e2e8f0" font-size="11.5" font-weight="500">⭐ Open-Source</text>
    </g>

    <!-- Pill 3: Enterprise SaaS -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#111827" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4.5" fill="#e2e8f0" font-size="11.5" font-weight="500">🏢 Enterprise SaaS</text>
    </g>

    <!-- Pill 4: Data Governance -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#111827" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4.5" fill="#e2e8f0" font-size="11.5" font-weight="500">🛡️ Lineage &amp; Quality</text>
    </g>
  </g>
</svg>
